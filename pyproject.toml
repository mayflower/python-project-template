[project]
name = "app"
version = "0.1.0"
description = "Python starter project for Coder workspaces"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.basedpyright]
# Language server in the editor; mypy stays the gate in CI and on save.
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=app", "--cov-report=term-missing"]

[tool.coverage.run]
omit = ["*/__main__.py"]
